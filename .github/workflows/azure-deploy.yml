name: Azure Login with OIDC
permissions:
      id-token: write
      contents: read
on:
  push:
    branches:
      - main  # Déclenchement sur push sur main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Se connecter à Azure via OIDC
        uses: azure/login@v2  # Version v2 de l'action azure/login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          auth-type: IDENTITY  # Spécification explicite pour l'authentification OIDC
          audience: api://AzureADTokenExchange
          allow-no-subscriptions: true  # Permet de ne pas spécifier de subscription
          enable-AzPSSession: false     # Désactive la session PowerShell

      - name: Vérifier l'authentification
        run: echo "OIDC Authentification réussie"
